<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Select Category</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/Title-icon.png" type="image/x-icon">

</head>
<body>
    <header class="main-header">
        <div class="container header-content">
            <a href="index.html" class="site-title"><h1>QuizMaster</h1></a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="container hero-content">  <!-- Container for hero section content -->
                <h2 class="hero-title">Fancy a Challenge?</h2>  <!-- Main title for the hero section -->
                <p class="hero-description">Choose a category below and embark on a thrilling journey of questions.</p>

                <div class="categories-grid"> <!-- Grid layout for category buttons -->
                    <button class="category-button science-btn" data-category="science">Science</button>
                    <button class="category-button history-btn" data-category="history">History</button>
                    <button class="category-button math-btn" data-category="math">Math</button>
                    <button class="category-button sports-btn" data-category="sports">Sports</button>
                    <button class="category-button geography-btn" data-category="geography">Geography</button>
                    <button class="category-button general-btn" data-category="general">General Knowledge</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 QuizMaster. All rights reserved.</p>
    </footer>

    <script type="module" src="script.js"></script>  <!-- JavaScript file for category selection logic -->
</body>
</html>
